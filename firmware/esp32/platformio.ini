; SafeCell AI firmware for ESP32 (run in the Wokwi simulator)
[env:esp32dev]
; 6.9.0 = Arduino core 2.0.x; the TFLite library below does not build on core 3.x
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; TensorFlow Lite Micro packaged for ESP32 / Arduino
lib_deps = tanakamasayuki/TensorFlowLite_ESP32@1.0.0
